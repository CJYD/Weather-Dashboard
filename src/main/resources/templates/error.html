<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Weather Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-8 col-lg-6">
                <div class="card error-card shadow-lg">
                    <div class="card-body text-center p-5">
                        <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                        <h1 class="display-4 mb-3">Oops!</h1>
                        <h3 class="mb-4" th:text="${error != null ? error : 'Something went wrong'}"></h3>
                        <p class="text-muted mb-4">
                            We couldn't fetch the weather data you requested.
                        </p>
                        <div class="alert alert-info" role="alert">
                            <strong>Suggestions:</strong>
                            <ul class="text-start mt-2 mb-0">
                                <li>Check the city name spelling</li>
                                <li>Try including the country code (e.g., "London, GB")</li>
                                <li>Verify your internet connection</li>
                                <li>Wait a moment and try again</li>
                            </ul>
                        </div>
                        <div class="mt-4">
                            <a href="/" class="btn btn-primary btn-lg">
                                <i class="fas fa-home"></i> Back to Dashboard
                            </a>
                        </div>
                        <div class="mt-3">
                            <small class="text-muted" th:if="${status}">
                                Error Code: <span th:text="${status}"></span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
